; Nur für die lokale Entwicklung:
; Die Worker laufen als root, damit sie dieselben Dateien lesen und schreiben können
; wie Composer und Artisan (die ebenfalls als root laufen). So gibt es unter Windows /
; WSL keine Rechteprobleme in storage/ und bootstrap/cache.
; Voraussetzung: php-fpm wird mit -R gestartet (siehe docker-compose.yml).
[www]
user = root
group = root
